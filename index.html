<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Drift Trikes - Controle & Locação</title>
  
  <!-- Configurações para rodar como App Nativo (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Drift Trikes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#020617" />
  <link rel="apple-touch-icon" href="icon-192x192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { cyan: '#06b6d4', orange: '#f97316' } }
        }
      }
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    button:active, .clickable:active { transform: scale(0.97); }
    body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    /* Esconde elementos admin por padrão */
    .admin-only { display: none !important; }
    /* Mostra elementos admin quando o body tiver a classe is-admin */
    body.is-admin .admin-only { display: flex !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none pb-14">

  <!-- TOAST NOTIFICAÇÃO -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4">
    <div class="bg-slate-900 border border-cyan-500 text-slate-100 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-sm font-semibold">
      <span id="toast-message">Mensagem</span>
    </div>
  </div>

  <!-- TELA DE LOGIN -->
  <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-500/20 rounded-full blur-[128px]"></div>
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl z-10">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-black italic uppercase tracking-wider bg-gradient-to-r from-cyan-400 via-blue-400 to-orange-400 bg-clip-text text-transparent">
          Drift Trikes
        </h1>
        <p class="text-slate-400 text-xs mt-1 uppercase font-bold tracking-widest">Painel Operacional</p>
      </div>

      <form id="form-login" class="space-y-4" onsubmit="handleLogin(event)">
        <div id="login-error" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-xl text-xs font-semibold text-center"></div>
        <div>
          <label class="block text-slate-400 text-xs font-bold mb-1.5 uppercase">Usuário</label>
          <input id="login-user" type="text" required placeholder="marrison, jonas ou maysa" class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 text-slate-100 px-4 py-3 rounded-xl text-sm outline-none" />
        </div>
        <div>
          <label class="block text-slate-400 text-xs font-bold mb-1.5 uppercase">Senha</label>
          <input id="login-pass" type="password" required placeholder="Digite a senha" class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-500 text-slate-100 px-4 py-3 rounded-xl text-sm outline-none" />
        </div>
        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-black py-3.5 rounded-xl uppercase tracking-wider text-sm transition-all mt-2">
          Entrar no Sistema
        </button>
      </form>
    </div>
  </div>

  <!-- CABEÇALHO & APP CONTAINER -->
  <div id="app-container" class="hidden flex-1 flex flex-col">
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl">
      <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between border-b border-slate-800/60">
        <div>
          <h1 class="font-black text-lg tracking-wide uppercase italic leading-tight text-white">Drift Trikes</h1>
          <p id="header-user-tag" class="text-[10px] text-cyan-400 font-semibold uppercase tracking-wider">Operador</p>
        </div>
        <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 bg-slate-800 p-2.5 rounded-xl text-xs font-bold">
          Sair
        </button>
      </div>

      <nav class="w-full bg-slate-900 py-2 px-3 border-t border-slate-800/40">
        <div class="max-w-5xl mx-auto flex items-center justify-start sm:justify-center gap-2">
          <button onclick="navigate('dashboard')" class="nav-item flex flex-col items-center justify-center py-2 px-4 rounded-xl">
             <span class="text-[10px] font-bold uppercase">Início</span>
          </button>
          <button onclick="navigate('rental')" class="nav-item flex flex-col items-center justify-center py-2 px-4 rounded-xl">
             <span class="text-[10px] font-bold uppercase">Alugar</span>
          </button>
          <button onclick="navigate('reports')" class="nav-item flex flex-col items-center justify-center py-2 px-4 rounded-xl">
             <span class="text-[10px] font-bold uppercase">Caixa</span>
          </button>
          <!-- ADMIN ONLY -->
          <button onclick="navigate('fleet')" class="nav-item admin-only flex flex-col items-center justify-center py-2 px-4 rounded-xl">
             <span class="text-[10px] font-bold uppercase">Frota</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="flex-1 max-w-5xl mx-auto w-full p-4">
      
      <!-- DASHBOARD -->
      <section id="view-dashboard" class="app-view space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div onclick="navigate('rental')" class="bg-cyan-600 p-6 rounded-3xl cursor-pointer">
            <h2 class="text-3xl font-black italic uppercase text-white mt-3 mb-1">Liberar Carrinhos</h2>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl">
            <h3 class="text-xl font-bold text-slate-100">Status</h3>
            <p class="text-sm text-slate-400 mt-2">Prontos para uso: <span id="dash-avail-count" class="text-cyan-400 font-bold text-lg">4</span></p>
          </div>
        </div>
      </section>

      <!-- ALUGAR -->
      <section id="view-rental" class="app-view space-y-5 hidden">
        <h2 class="text-xl font-black uppercase italic text-white">Simulação de Aluguel</h2>
        <button onclick="simularVenda()" class="bg-green-600 text-white font-bold py-3 px-6 rounded-xl w-full uppercase">
          Registrar Venda (R$ 10,00)
        </button>
      </section>

      <!-- CAIXA E FECHAMENTO -->
      <section id="view-reports" class="app-view space-y-5 hidden">
        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800 text-center">
          <h2 class="text-xl font-black uppercase italic text-white mb-2">Caixa Atual (Global)</h2>
          <p class="text-xs text-slate-400 mb-4">Soma das vendas de Jonas, Maysa e Marrison</p>
          <div class="text-4xl font-black text-green-400 mb-6" id="valor-caixa-global">R$ 0,00</div>
          
          <button onclick="fecharCaixaGlobal()" class="bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl uppercase tracking-wider w-full shadow-lg">
            Fechar Caixa de Todos
          </button>
        </div>
      </section>

      <!-- FROTA (ADMIN) -->
      <section id="view-fleet" class="app-view space-y-5 hidden">
        <h2 class="text-xl font-black uppercase italic text-white">Gerenciar Frota (Apenas Admin)</h2>
        <p class="text-sm text-slate-400">Esta tela só aparece para o Marrison.</p>
      </section>

    </main>
  </div>

  <script>
    lucide.createIcons();

    // 1. USUÁRIOS FIXOS
    const USUARIOS = {
      'marrison': { senha: '123', nome: 'Marrison Carlos', role: 'admin' },
      'jonas': { senha: '123', nome: 'Jonas André', role: 'vendor' },
      'maysa': { senha: '123', nome: 'Maysa', role: 'vendor' }
    };

    let usuarioLogado = null;
    let caixaGlobal = parseInt(localStorage.getItem('drift_caixa')) || 0;

    // 2. FUNÇÃO DE LOGIN
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.toLowerCase().trim();
      const pass = document.getElementById('login-pass').value;
      const errorDiv = document.getElementById('login-error');

      if (USUARIOS[user] && USUARIOS[user].senha === pass) {
        usuarioLogado = USUARIOS[user];
        errorDiv.classList.add('hidden');
        iniciarApp();
      } else {
        errorDiv.textContent = 'Usuário ou senha incorretos!';
        errorDiv.classList.remove('hidden');
      }
    }

    function iniciarApp() {
      document.getElementById('view-login').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      document.getElementById('header-user-tag').textContent = `${usuarioLogado.nome} (${usuarioLogado.role})`;
      
      // Se for admin, adiciona classe no body para mostrar menus ocultos
      if (usuarioLogado.role === 'admin') {
        document.body.classList.add('is-admin');
      } else {
        document.body.classList.remove('is-admin');
      }

      atualizarTelaCaixa();
      navigate('dashboard');
      showToast(`Bem-vindo, ${usuarioLogado.nome}!`);
    }

    function handleLogout() {
      usuarioLogado = null;
      document.getElementById('form-login').reset();
      document.getElementById('app-container').classList.add('hidden');
      document.getElementById('view-login').classList.remove('hidden');
      document.body.classList.remove('is-admin');
    }

    // 3. NAVEGAÇÃO
    function navigate(viewId) {
      document.querySelectorAll('.app-view').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${viewId}`).classList.remove('hidden');
    }

    // 4. LÓGICA DE CAIXA GLOBAL
    function simularVenda() {
      caixaGlobal += 10;
      localStorage.setItem('drift_caixa', caixaGlobal); // Salva no dispositivo
      atualizarTelaCaixa();
      showToast('Venda registrada no caixa global!');
    }

    function atualizarTelaCaixa() {
      document.getElementById('valor-caixa-global').textContent = `R$ ${caixaGlobal.toFixed(2).replace('.', ',')}`;
    }

    function fecharCaixaGlobal() {
      if(caixaGlobal === 0) {
        showToast('O caixa já está zerado.');
        return;
      }
      
      if(confirm(`Tem certeza que deseja fechar o caixa de R$ ${caixaGlobal}? Isso irá zerar o contador de todos os usuários.`)) {
        caixaGlobal = 0;
        localStorage.setItem('drift_caixa', caixaGlobal);
        atualizarTelaCaixa();
        showToast('Caixa fechado com sucesso!');
      }
    }

    // 5. SINCRONIZAÇÃO ENTRE ABAS (SIMULA O TEMPO REAL)
    // Se Jonas faz uma venda, a aba da Maysa atualiza automaticamente
    window.addEventListener('storage', (e) => {
      if(e.key === 'drift_caixa') {
        caixaGlobal = parseInt(e.newValue) || 0;
        atualizarTelaCaixa();
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
      }, 3000);
    }
  </script>
</body>
</html>
